<!DOCTYPE html>
<html lang="en">
<head>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | PostIt</title>
    <link rel="stylesheet" href="css/loginStylesheet.css">
  </head>

  <body>
    <header class="navbar">
        <a class="home-link">
            <strong>Home</strong>
        </a>
        <a class="profile-link" href="" label="Profile">
            <img src="images/profile-img.jpg" alt="">
        </a>
        </header>

        <main>
            <section class="login-card">
                <h1>Welcome to PostIt</h1>
                <a class="account-link" href="">Create an account</a>
                <p class="seperator">or</p>
                <p>Please log in</p>
        
            <form action="index.html">
                <input type="text" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Log in</button>
            </form>

            <a class="forgot-password" href="">Forgot password</a>
            </section>
        </main>
  </body>
</html>
